required-version = "==0.16.0"

# Self-contained subprojects keep their own lint configuration
# (see Services/artifact-cache-gateway/pyproject.toml).
extend-exclude = ["Services/artifact-cache-gateway"]

[lint]
external = ["E402", "N802"]

[lint.per-file-ignores]
# Tests use explicit line lists to keep multiline fixtures readable.
"**/tests/*.py" = ["FLY002"]
"Agents/Harbor-opencode/__init__.py" = ["N999"]
"Agents/Harbor-pi/__init__.py" = ["N999"]
