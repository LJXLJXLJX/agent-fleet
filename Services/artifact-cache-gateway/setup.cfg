[metadata]
name = artifact-cache-gateway
version = 0.2.0
description = A small, source-configurable HTTP artifact cache gateway
long_description = file: README.md
long_description_content_type = text/markdown

[options]
packages =
    artifact_cache_gateway
    artifact_cache_gateway.cli
    artifact_cache_gateway.core
    artifact_cache_gateway.core.config
    artifact_cache_gateway.core.ecosystems
    artifact_cache_gateway.gateway
    artifact_cache_gateway.gateway.engine
    artifact_cache_gateway.gateway.services
    artifact_cache_gateway.harbor_tasks
    artifact_cache_gateway.harbor_tasks.analyzer
    artifact_cache_gateway.harbor_tasks.preparer
    artifact_cache_gateway.harbor_tasks.preparer.direct_download
    artifact_cache_gateway.harbor_tasks.preparer.providers
    artifact_cache_gateway.harbor_tasks.preparer.providers.apt
    artifact_cache_gateway.harbor_tasks.preparer.providers.pip
    artifact_cache_gateway.storage
    artifact_cache_gateway.ui
package_dir =
    artifact_cache_gateway = src
python_requires = >=3.10
include_package_data = True
install_requires =
    boto3==1.26.134

[options.package_data]
artifact_cache_gateway.harbor_tasks.preparer.providers =
    npm_resolver.js
artifact_cache_gateway.harbor_tasks.preparer.providers.apt =
    resolver_script.sh
artifact_cache_gateway.harbor_tasks.preparer.providers.pip =
    resolver_script.py
artifact_cache_gateway.ui =
    static/index.html
    static/styles.css
    static/app.js
    static/README.md

[options.entry_points]
console_scripts =
    artifact-cache-gateway = artifact_cache_gateway.cli.main:main
    artifact-cache-prepare = artifact_cache_gateway.harbor_tasks.preparer.cli:main
    artifact-cache-inventory = artifact_cache_gateway.cli.inventory:main
    artifact-cache-stats = artifact_cache_gateway.cli.stats:main
